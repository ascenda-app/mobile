name: Android POC (debug)

# Propuesta M1 — no ejecutada todavía.
# Solo manual: no se dispara en push ni en PR, y no publica en ninguna tienda.
on:
  workflow_dispatch:
    inputs:
      gateway_url:
        description: "URL del gateway que verá el emulador (p. ej. http://10.0.2.2:8080)"
        required: true
        default: "http://10.0.2.2:8080"

permissions:
  contents: read

env:
  VITE_GATEWAY_URL: ${{ inputs.gateway_url }}
  # POC sin proveedor de teselas autorizado: el mapa no se pinta.
  VITE_MAP_ENABLED: "false"

defaults:
  run:
    working-directory: app

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run verify

  android-debug:
    name: android-debug
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - run: npm run build

      - run: npx cap sync android

      # El runner no siempre trae la plataforma 36 (compileSdk del proyecto).
      - name: Instalar Android SDK 36 si falta
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-36" "build-tools;36.0.0" > /dev/null
          fi
          ls "$ANDROID_HOME/platforms" | tail -3

      # El APK debug se firma solo con el keystore de depuración que genera Gradle
      # (~/.android/debug.keystore). No se usan claves release ni secretos del repo.
      - name: Assemble debug
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        working-directory: app/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Comprobar que el APK existe y está firmado
        working-directory: app/android
        run: |
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$apk"
          echo "APK: $apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
